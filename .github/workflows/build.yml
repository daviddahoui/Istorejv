name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: istoredb
          MYSQL_USER: istore
          MYSQL_PASSWORD: istore
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uistore -pistore"
          --health-interval 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Créer la base
        run: |
          for f in database/*.sql; do
            mysql -h 127.0.0.1 -uistore -pistore --default-character-set=utf8mb4 istoredb < "$f"
          done

      - name: Compiler et tester
        run: ./mvnw -B verify
